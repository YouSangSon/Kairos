name: Core checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - services/core/**
      - services/research/**
      - contracts/**
      - tests/**
      - tools/**
      - Makefile
      - .tool-versions
      - .github/workflows/core-checks.yml

permissions:
  contents: read

concurrency:
  group: core-checks
  cancel-in-progress: false

jobs:
  core:
    if: github.repository == 'YouSangSon/Kairos' && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read the asdf project versions
        id: tool_versions
        run: |
          golang=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          python=$(awk '$1 == "python" { print $2 }' .tool-versions)
          [[ "$golang" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid golang version in .tool-versions' >&2; exit 1; }
          [[ "$python" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid python version in .tool-versions' >&2; exit 1; }
          printf 'golang=%s\npython=%s\n' "$golang" "$python" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.tool_versions.outputs.golang }}
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.tool_versions.outputs.python }}
      - name: Verify tool pins
        env:
          EXPECTED_GO_VERSION: ${{ steps.tool_versions.outputs.golang }}
          EXPECTED_PYTHON_VERSION: ${{ steps.tool_versions.outputs.python }}
        run: |
          test "$(go env GOVERSION)" = "go$EXPECTED_GO_VERSION"
          test "$(python -c 'import platform; print(platform.python_version())')" = "$EXPECTED_PYTHON_VERSION"
          go version
          python --version
      - name: Check paper promotion and migration compatibility first
        run: make test FLUTTER=true CORE_TEST_PACKAGES="-run='^(TestPaperPromotion|TestG38EMigration20PreservesNonemptyV19JournalsProofsAndForeignKeys)' -count=1 -timeout=10m ./..."
      - name: Check core, research and contracts with owned cleanup
        # The client release workflow owns Flutter checks.
        run: make check DART=true FLUTTER=true CORE_TEST_PACKAGES='-timeout=30m ./...'
      - name: Verify source identity
        run: git diff --exit-code
